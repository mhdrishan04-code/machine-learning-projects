name: Import Binary Assets

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merge repository
        uses: actions/checkout@v4

      - name: Download binary assets from source repositories
        run: |
          set -e

          mkdir -p "Rule-based AI-ML Learning Chatbot/assets"
          mkdir -p "AI Movie Recommendation System"
          mkdir -p "AI Text Recognition"

          curl -L --fail "https://raw.githubusercontent.com/mhdrishan04-code/task-1-rishan/main/chatbot%20screenshot.png" \
            -o "Rule-based AI-ML Learning Chatbot/assets/chatbot screenshot.png"

          curl -L --fail "https://raw.githubusercontent.com/mhdrishan04-code/task-1-rishan/main/chatbot%20working%20model.mp4" \
            -o "Rule-based AI-ML Learning Chatbot/assets/chatbot working model.mp4"

          curl -L --fail "https://raw.githubusercontent.com/mhdrishan04-code/task-3.1-rishan/main/logo.png" \
            -o "AI Movie Recommendation System/logo.png"

          curl -L --fail "https://raw.githubusercontent.com/mhdrishan04-code/task-4-rishan/main/sample.png" \
            -o "AI Text Recognition/sample.png"

      - name: Commit imported assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Rule-based AI-ML Learning Chatbot/assets" "AI Movie Recommendation System/logo.png" "AI Text Recognition/sample.png"
          if git diff --cached --quiet; then
            echo "No binary assets to add."
          else
            git commit -m "Update binary asset paths"
            git push
          fi
